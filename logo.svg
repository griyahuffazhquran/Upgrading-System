<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <!-- Top Arc Path for Text -->
    <path id="textArcTop" d="M 65,250 A 185,185 0 1,1 435,250" fill="none" />
    <!-- Bottom Arc Path for Text -->
    <path id="textArcBottom" d="M 435,250 A 185,185 0 0,1 65,250" fill="none" />
    <!-- Linear & Radial Gradient Definitions -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
  </defs>

  <!-- Outer Ring Border 1 -->
  <circle cx="250" cy="250" r="240" fill="none" stroke="#15803d" stroke-width="7" />
  <!-- Outer Ring Border 2 -->
  <circle cx="250" cy="250" r="230" fill="none" stroke="#15803d" stroke-width="3" />
  <!-- Inner Ring Border -->
  <circle cx="250" cy="250" r="162" fill="none" stroke="#15803d" stroke-width="4" />

  <!-- Circular Text Outer Ring -->
  <text font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="25" fill="#15803d" letter-spacing="3.5">
    <textPath href="#textArcTop" startOffset="50%" text-anchor="middle">
      YAYASAN GRIYA CIPTA GENERASI QUR'ANI
    </textPath>
  </text>

  <text font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="26" fill="#15803d" letter-spacing="6">
    <textPath href="#textArcBottom" startOffset="50%" text-anchor="middle">
      ★ LAMPUNG ★
    </textPath>
  </text>

  <!-- Geometric Intertwined 8-Pointed Star Pattern (Islamic Octagram Ribbon) -->
  <g stroke="#15803d" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Square 1 -->
    <rect x="140" y="140" width="220" height="220" rx="20" />
    <!-- Square 2 Rotated 45 deg -->
    <rect x="140" y="140" width="220" height="220" rx="20" transform="rotate(45 250 250)" />
  </g>

  <!-- Center Symbol: Orange Quran Book & 3 Interconnected Figures -->
  <g transform="translate(250, 260)">
    <!-- Open Book Pages (Orange) -->
    <!-- Left Page -->
    <path d="M -70,30 C -35,15 -10,25 0,35 C -10,50 -35,40 -70,55 Z" fill="#f97316" stroke="#ea580c" stroke-width="2" />
    <path d="M -70,10 C -35,-5 -10,5 0,15 C -10,30 -35,20 -70,35 Z" fill="#f97316" stroke="#ea580c" stroke-width="2" />
    <!-- Right Page -->
    <path d="M 70,30 C 35,15 10,25 0,35 C 10,50 35,40 70,55 Z" fill="#f97316" stroke="#ea580c" stroke-width="2" />
    <path d="M 70,10 C 35,-5 10,5 0,15 C 10,30 35,20 70,35 Z" fill="#f97316" stroke="#ea580c" stroke-width="2" />

    <!-- Center Rehal / Stand Base -->
    <path d="M -20,40 L 0,25 L 20,40 L 0,60 Z" fill="#ea580c" />

    <!-- 3 Figures (Central Leader + 2 Side Companions) -->
    <!-- Top Central Head -->
    <circle cx="0" cy="-62" r="16" fill="#f97316" stroke="#ea580c" stroke-width="2" />
    <!-- Left Companion Head -->
    <circle cx="-32" cy="-32" r="14" fill="#f97316" stroke="#ea580c" stroke-width="2" />
    <!-- Right Companion Head -->
    <circle cx="32" cy="-32" r="14" fill="#f97316" stroke="#ea580c" stroke-width="2" />

    <!-- Interconnected Bodies / Arms curve -->
    <path d="M -45,-15 C -30,-45 0,-50 0,-30 C 0,-50 30,-45 45,-15 C 30,-5 15,-15 0,0 C -15,-15 -30,-5 -45,-15 Z" fill="#f97316" stroke="#ea580c" stroke-width="2" />
  </g>
</svg>
